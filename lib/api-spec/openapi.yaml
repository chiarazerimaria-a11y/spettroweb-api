openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: admin
  - name: subscribers
  - name: courses
  - name: payments
  - name: machines
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Dashboard summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSummary" }

  /admin/subscribers:
    get:
      operationId: listSubscribers
      tags: [subscribers]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Subscriber" }
    post:
      operationId: createSubscriber
      tags: [subscribers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSubscriberBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscriber" }
  /admin/subscribers/{id}:
    patch:
      operationId: updateSubscriber
      tags: [subscribers]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSubscriberBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscriber" }
    delete:
      operationId: deleteSubscriber
      tags: [subscribers]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /admin/courses:
    get:
      operationId: listCourses
      tags: [courses]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Course" }
    post:
      operationId: createCourse
      tags: [courses]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCourseBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
  /admin/courses/{id}:
    patch:
      operationId: updateCourse
      tags: [courses]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCourseBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
    delete:
      operationId: deleteCourse
      tags: [courses]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /admin/payments:
    get:
      operationId: listPayments
      tags: [payments]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payment" }
    post:
      operationId: createPayment
      tags: [payments]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
  /admin/payments/{id}:
    patch:
      operationId: updatePayment
      tags: [payments]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePaymentBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
    delete:
      operationId: deletePayment
      tags: [payments]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /admin/machines:
    get:
      operationId: listMachines
      tags: [machines]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Machine" }
    post:
      operationId: createMachine
      tags: [machines]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMachineBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
  /admin/machines/{id}:
    patch:
      operationId: updateMachine
      tags: [machines]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMachineBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
    delete:
      operationId: deleteMachine
      tags: [machines]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    AdminSummary:
      type: object
      required: [totalSubscribers, activeSubscribers, totalCourses, totalRevenue, pendingPayments, paidPayments, machinesCompleted, machinesInProgress, machinesPlanned]
      properties:
        totalSubscribers: { type: integer }
        activeSubscribers: { type: integer }
        totalCourses: { type: integer }
        totalRevenue: { type: number }
        pendingPayments: { type: integer }
        paidPayments: { type: integer }
        machinesCompleted: { type: integer }
        machinesInProgress: { type: integer }
        machinesPlanned: { type: integer }
        recentSubscribers:
          type: array
          items: { $ref: "#/components/schemas/Subscriber" }

    Subscriber:
      type: object
      required: [id, name, email, status, plan, joinedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        status: { type: string, enum: [active, inactive, trial] }
        plan: { type: string }
        notes: { type: string, nullable: true }
        joinedAt: { type: string, format: date-time }
    CreateSubscriberBody:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        status: { type: string, enum: [active, inactive, trial] }
        plan: { type: string }
        notes: { type: string, nullable: true }
    UpdateSubscriberBody:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [active, inactive, trial] }
        plan: { type: string }
        notes: { type: string, nullable: true }

    Course:
      type: object
      required: [id, title, description, price, level, durationHours, published, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        price: { type: number }
        level: { type: string, enum: [principiante, intermedio, avanzado] }
        durationHours: { type: integer }
        videoUrl: { type: string, nullable: true }
        published: { type: boolean }
        createdAt: { type: string, format: date-time }
    CreateCourseBody:
      type: object
      required: [title, description, price, level, durationHours]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        price: { type: number, minimum: 0 }
        level: { type: string, enum: [principiante, intermedio, avanzado] }
        durationHours: { type: integer, minimum: 0 }
        videoUrl: { type: string, nullable: true }
        published: { type: boolean }
    UpdateCourseBody:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        price: { type: number }
        level: { type: string, enum: [principiante, intermedio, avanzado] }
        durationHours: { type: integer }
        videoUrl: { type: string, nullable: true }
        published: { type: boolean }

    Payment:
      type: object
      required: [id, subscriberName, amount, method, status, reference, createdAt]
      properties:
        id: { type: integer }
        subscriberId: { type: integer, nullable: true }
        subscriberName: { type: string }
        amount: { type: number }
        method: { type: string, enum: [transferencia, tarjeta, paypal, bizum, efectivo] }
        status: { type: string, enum: [pendiente, pagado, fallido, reembolsado] }
        reference: { type: string }
        bank: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    CreatePaymentBody:
      type: object
      required: [subscriberName, amount, method]
      properties:
        subscriberId: { type: integer, nullable: true }
        subscriberName: { type: string, minLength: 1 }
        amount: { type: number, minimum: 0 }
        method: { type: string, enum: [transferencia, tarjeta, paypal, bizum, efectivo] }
        status: { type: string, enum: [pendiente, pagado, fallido, reembolsado] }
        reference: { type: string }
        bank: { type: string, nullable: true }
    UpdatePaymentBody:
      type: object
      properties:
        amount: { type: number }
        method: { type: string, enum: [transferencia, tarjeta, paypal, bizum, efectivo] }
        status: { type: string, enum: [pendiente, pagado, fallido, reembolsado] }
        reference: { type: string }
        bank: { type: string, nullable: true }

    Machine:
      type: object
      required: [id, name, platform, difficulty, status, points, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        platform: { type: string }
        difficulty: { type: string, enum: [facil, medio, dificil, insano] }
        status: { type: string, enum: [planificada, en_progreso, completada] }
        points: { type: integer }
        ip: { type: string, nullable: true }
        os: { type: string, nullable: true }
        techniques: { type: string, nullable: true }
        writeupUrl: { type: string, nullable: true }
        videoUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    CreateMachineBody:
      type: object
      required: [name, platform, difficulty]
      properties:
        name: { type: string, minLength: 1 }
        platform: { type: string }
        difficulty: { type: string, enum: [facil, medio, dificil, insano] }
        status: { type: string, enum: [planificada, en_progreso, completada] }
        points: { type: integer, minimum: 0 }
        ip: { type: string, nullable: true }
        os: { type: string, nullable: true }
        techniques: { type: string, nullable: true }
        writeupUrl: { type: string, nullable: true }
        videoUrl: { type: string, nullable: true }
    UpdateMachineBody:
      type: object
      properties:
        name: { type: string }
        platform: { type: string }
        difficulty: { type: string, enum: [facil, medio, dificil, insano] }
        status: { type: string, enum: [planificada, en_progreso, completada] }
        points: { type: integer }
        ip: { type: string, nullable: true }
        os: { type: string, nullable: true }
        techniques: { type: string, nullable: true }
        writeupUrl: { type: string, nullable: true }
        videoUrl: { type: string, nullable: true }
